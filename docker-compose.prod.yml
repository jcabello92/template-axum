name: ${PROJECT_NAME}-rust

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: ${PROJECT_NAME}-rust-app
    restart: always
    env_file:
      - .env
    networks:
      - template-network

networks:
  template-network:
    external: true
    name: ${PROJECT_NAME}-network
